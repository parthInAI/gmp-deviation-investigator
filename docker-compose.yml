# Stack: Redpanda (Kafka API + schema registry), Console, and one-shot tool
# containers (app = Python producers/gates, spark* = bronze, silver, gold jobs).
#
#   docker compose up -d --wait            # broker, registry, console (http://localhost:8080)
#   docker compose run --rm app python -m streaming.registry register
#   docker compose run --rm app python -m streaming.replayer --csv data/raw/<file>.csv
#   docker compose run --rm spark          # Kafka -> bronze Delta (availableNow)
#   docker compose run --rm app python -m lakehouse.gate_check
#   docker compose run --rm spark-silver   # bronze -> silver / quarantine / alerts
#   docker compose run --rm spark-gold     # silver -> gold

name: gmpdi

# Shared by the three Spark services. JOB picks the script (see
# orchestration/spark-job.sh); extra arguments after the service name go to the
# script, e.g. `docker compose run --rm spark --trigger continuous`.
# Phase 4 agents image (Dockerfile.agents): MCP servers, regulatory retrieval, LangGraph lead, evals.
# API keys come only from your local .env (never committed). Start the services with:
#   docker compose --profile agents up -d --wait postgres historian historian-dev qms case-historian
x-agents: &agents
  build:
    context: .
    dockerfile: Dockerfile.agents
  image: gmpdi-agents:dev
  profiles: ["agents"]
  working_dir: /app
  environment: &agents-env
    PYTHONPATH: /app
    HISTORIAN_SOURCE: /lakehouse/silver/process_sensor
    HISTORIAN_MCP_URL: http://historian:8101/mcp
    QMS_MCP_URL: http://qms:8102/mcp
    CASE_HISTORIAN_A2A_URL: http://case-historian:8103
    REGULATION_STORE: pgvector
    PGHOST: postgres
    PGUSER: gmpdi
    PGPASSWORD: gmpdi
    PGDATABASE: gmpdi
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
    LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
    LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-gmpdi-phase4}
    GMPDI_AUDIT_KEY: ${GMPDI_AUDIT_KEY:-}
  volumes:  # code is baked into the image; mounts let you edit without rebuilding
    - ./agents:/app/agents:ro
    - ./mcp_servers:/app/mcp_servers:ro
    - ./evals:/app/evals
    - ./regulatory:/app/regulatory:ro
    - ./qms:/app/qms:ro
    - ./models:/app/models:ro
    - ./out:/app/out
    - lakehouse:/lakehouse:ro

x-spark: &spark
  build:
    context: .
    dockerfile: Dockerfile.spark
    args:
      SPARK_IMAGE_TAG: ${SPARK_IMAGE_TAG:-4.0.4-java21-python3}
  image: gmpdi-spark:dev   # apache/spark + pinned Kafka/Avro/Delta jars + our code
  profiles: ["tools"]
  user: root  # the named volumes are root-owned; fine for a local dev box
  environment: &spark-env
    JOB: bronze.py
    SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
    KAFKA_BOOTSTRAP: redpanda:9092
    SCHEMA_REGISTRY_URL: http://redpanda:8081
    LAKEHOUSE_DIR: /lakehouse
    GMPDI_TOPIC_SUFFIX: ${GMPDI_TOPIC_SUFFIX:-}
  volumes:  # code is also baked into the image; the mounts let you edit without rebuilding
    - ./lakehouse:/opt/app/lakehouse:ro
    - ./contracts:/opt/app/contracts:ro
    - ./streaming/schemas:/opt/app/streaming/schemas:ro
    - lakehouse:/lakehouse
  depends_on:
    redpanda:
      condition: service_healthy

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:-v25.3.11}
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container   # single node, relaxed fsync: laptop settings, not production
      - --smp 1
      - --memory 1G
      - --default-log-level=warn
    ports:
      - "19092:19092"  # Kafka API for clients on your machine
      - "18081:18081"  # Schema registry
      - "18082:18082"  # HTTP proxy
      - "19644:9644"   # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20

  console:
    image: docker.redpanda.com/redpandadata/console:${CONSOLE_VERSION:-v3.12.0}
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  app:
    build: .
    image: gmpdi-app:dev
    profiles: ["tools"]
    working_dir: /app
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      REDPANDA_ADMIN_URL: http://redpanda:9644
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
      GMPDI_TOPIC_SUFFIX: ${GMPDI_TOPIC_SUFFIX:-}
      MLFLOW_TRACKING_URI: sqlite:///out/mlflow/mlflow.db
      MLFLOW_DISABLE_AGENT_HINT: "1"
      PYTHONPATH: /app
    volumes:
      - ./streaming:/app/streaming:ro
      - ./lakehouse:/app/lakehouse:ro
      - ./contracts:/app/contracts:ro
      - ./drift:/app/drift:ro
      - ./models:/app/models   # writable: training writes frozen artifacts here
      - ./tests/fixtures:/app/tests/fixtures:ro
      - ${RAW_DATA_DIR:-./data/raw}:/app/data/raw:ro
      - ./out:/app/out
      - lakehouse:/lakehouse
    depends_on:
      redpanda:
        condition: service_healthy

  fetch-data:  # one-off: download, verify and unzip IndPenSim into RAW_DATA_DIR
    image: gmpdi-app:dev
    profiles: ["tools"]
    working_dir: /app
    environment:
      PYTHONPATH: /app
    volumes:
      - ./streaming:/app/streaming:ro
      - ${RAW_DATA_DIR:-./data/raw}:/data
    command: ["python", "-m", "streaming.fetch_data", "--dest", "/data"]

  # Three Spark jobs, one image and one set of jars (the x-spark block at the top):
  #   docker compose run --rm spark          Kafka -> bronze
  #   docker compose run --rm spark-silver   bronze -> silver + quarantine + alerts (data contracts)
  #   docker compose run --rm spark-gold     silver -> gold
  spark:
    <<: *spark
    command: ["--topic", "all"]

  spark-silver:
    <<: *spark
    environment:
      <<: *spark-env
      JOB: silver.py
    command: ["--contract", "all"]

  spark-gold:
    <<: *spark
    environment:
      <<: *spark-env
      JOB: gold.py
    command: []

  # MLflow UI over the runs logged by models.train (out/mlflow).  http://localhost:5000
  mlflow:
    image: gmpdi-app:dev
    profiles: ["mlflow"]
    working_dir: /app
    command: ["mlflow", "ui", "--backend-store-uri", "sqlite:///out/mlflow/mlflow.db", "--host", "0.0.0.0", "--port", "5000"]
    volumes:
      - ./out:/app/out
      - ./models:/app/models:ro
    ports:
      - "5000:5000"

  # Airflow 3 (standalone: API server, scheduler, DAG processor, triggerer in one
  # container, SQLite metadata DB). Local orchestration only, not a production setup.
  #   docker compose --profile airflow up -d airflow     ->  http://localhost:8090
  # Tasks start gmpdi-app / gmpdi-spark containers through the Docker socket, so
  # build those images first: docker compose build app spark
  airflow:
    image: apache/airflow:${AIRFLOW_VERSION:-3.3.2-python3.12}
    profiles: ["airflow"]
    command: standalone
    group_add: ["${DOCKER_GID:-0}"]  # access to the Docker socket (Linux: `getent group docker`)
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"  # local dev: no login page
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
      GMPDI_COMPOSE_PROJECT: gmpdi
    volumes:
      - airflow-home:/opt/airflow
      - ./orchestration/dags:/opt/airflow/dags:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      redpanda:
        condition: service_healthy

  # ---- Phase 4: agents (profile "agents") -------------------------------------
  postgres:  # pgvector store for regulations (and, in Phase 5, the audit log)
    image: pgvector/pgvector:0.8.0-pg17
    profiles: ["agents"]
    environment:
      POSTGRES_USER: gmpdi
      POSTGRES_PASSWORD: gmpdi
      POSTGRES_DB: gmpdi
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmpdi"]
      interval: 5s
      timeout: 5s
      retries: 20

  historian:  # MCP server over the real silver table (read-only)
    <<: *agents
    command: ["python", "-m", "mcp_servers.historian.server"]
    environment:
      <<: *agents-env
      MCP_PORT: "8101"
    ports:
      - "8101:8101"
    healthcheck: &tcp-health
      test: ["CMD", "python", "-c", "import socket,os; socket.create_connection(('localhost', int(os.environ['MCP_PORT'])), 2)"]
      interval: 5s
      timeout: 5s
      retries: 30

  historian-dev:  # the same server over the development faults (out/dev_cases.parquet), never the test batches
    <<: *agents
    command: ["python", "-m", "mcp_servers.historian.server"]
    environment:
      <<: *agents-env
      MCP_PORT: "8111"
      HISTORIAN_SOURCE: /app/out/dev_cases.parquet
    ports:
      - "8111:8111"
    healthcheck: *tcp-health

  qms:  # MCP server over the synthetic SOPs and deviations (read-only)
    <<: *agents
    command: ["python", "-m", "mcp_servers.qms.server"]
    environment:
      <<: *agents-env
      MCP_PORT: "8102"
    ports:
      - "8102:8102"
    healthcheck: *tcp-health

  case-historian:  # CrewAI agent behind A2A (own image: CrewAI pins its own dependencies)
    build:
      context: .
      dockerfile: Dockerfile.crew
    image: gmpdi-crew:dev
    profiles: ["agents"]
    environment:
      PYTHONPATH: /app
      QMS_MCP_URL: http://qms:8102/mcp
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CASE_HISTORIAN_MODE: ${CASE_HISTORIAN_MODE:-crew}
      CASE_HISTORIAN_PUBLIC_URL: http://case-historian:8103
      A2A_PORT: "8103"
    volumes:
      - ./agents/case_history:/app/agents/case_history:ro
    ports:
      - "8103:8103"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8103/.well-known/agent-card.json', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      qms:
        condition: service_healthy

  agents:  # one-off runner: docker compose --profile agents run --rm agents python -m agents.run investigate --batch 94
    <<: *agents
    command: ["python", "-m", "agents.run", "--help"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  redpanda-data:
  lakehouse:     # Delta tables live here, not in your (OneDrive-synced) project folder
  pipeline-out:  # manifests and reports written by Airflow-run tasks
  airflow-home:  # Airflow metadata DB (SQLite) and logs
  pgdata:        # Phase 4 Postgres (pgvector)
